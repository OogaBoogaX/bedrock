name: Deploy to GitHub Pages

on:
  push:
    branches: [rock]
  schedule:
    # Refresh public GitHub activity every 15 minutes without a code change.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build · Astro site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_VISITS_API_URL: ${{ vars.VISITS_API_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test visit-count proxy
        run: pnpm visits:test
      - name: Sync GitHub members, contributors, and impact scores
        # A read:org PAT in TRIBE_GITHUB_TOKEN also discovers private memberships;
        # the workflow token still covers all public scoring data.
        env:
          GITHUB_TOKEN: ${{ secrets.TRIBE_GITHUB_TOKEN || github.token }}
        run: pnpm tribe:sync
      - name: Type check
        run: pnpm check
      - name: Build static site
        run: pnpm build
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/rock'
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
